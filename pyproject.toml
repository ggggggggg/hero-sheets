[project]
name = "hero-sheets"
version = "0.1.0"
description = "A kids' D&D-style character builder that prints a 2-page hero sheet."
requires-python = ">=3.11"
dependencies = [
    "polars",
    "playwright",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "pymupdf",
]

[tool.setuptools]
packages = ["charsheet"]
