name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Node is required: the website runs web/core.js, and the parity tests
      # run both the Python reference and the JS copy and assert identical output.
      # Without node these tests silently skip, so CI would pass untested JS.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: uv sync

      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      - name: Run tests
        run: uv run pytest -q

      - name: Fail if the JS parity tests were skipped
        run: uv run pytest -q -o addopts="" tests/test_web_parity.py tests/test_custom.py::test_js_merge_matches_python
